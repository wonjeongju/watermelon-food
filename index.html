<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>더워터멜론 근처 맛집</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
:root{
  --bg:#f4f5f7;--panel:#ffffff;--ink:#1f2328;--ink2:#5b6470;--ink3:#8a929d;--line:#e6e8ec;
  --accent:#f26457;--accent-ink:#ffffff;--accent-soft:#fdeceb;--green:#2f8f5b;--green-soft:#e3f3ea;
  --map:#f2efe9;--block:#e9e4dd;--road:#ffffff;--road-ink:#6b6f76;--park:#cfe6cf;
  --star:#f2a33a;--chip:#ffffff;--warn:#b7791f;--warn-soft:#fdf3dc;--shadow:0 1px 2px rgba(20,24,30,.06),0 6px 20px rgba(20,24,30,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171b;--panel:#1f2227;--ink:#eef0f3;--ink2:#aab1bb;--ink3:#7b838e;--line:#2e333a;
  --accent:#f26457;--accent-ink:#ffffff;--accent-soft:#3a2724;--green:#4fb87c;--green-soft:#1f3a2b;
  --map:#23262b;--block:#2c3036;--road:#3a3f46;--road-ink:#aab1bb;--park:#2b4a35;
  --star:#f2a33a;--chip:#262a30;--warn:#e0b25c;--warn-soft:#3a3120;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#15171b;--panel:#1f2227;--ink:#eef0f3;--ink2:#aab1bb;--ink3:#7b838e;--line:#2e333a;
  --accent:#f26457;--accent-ink:#ffffff;--accent-soft:#3a2724;--green:#4fb87c;--green-soft:#1f3a2b;
  --map:#23262b;--block:#2c3036;--road:#3a3f46;--road-ink:#aab1bb;--park:#2b4a35;
  --star:#f2a33a;--chip:#262a30;--warn:#e0b25c;--warn-soft:#3a3120;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100vh;min-height:600px}
header.top{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px 12px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header.top h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em}
header.top .sub{color:var(--ink2);font-size:15px}
header.top .count{margin-left:auto;color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}
.top .viewtoggle{align-self:center;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
.chips{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 20px;font-size:15px;white-space:nowrap;transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:focus-visible,.pill:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:400px 1fr;gap:14px;padding:14px;min-height:0}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;padding-right:2px}
.filters{background:var(--panel);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);flex:none}
.filters h3{margin:0 0 8px;font-size:14px;font-weight:700}
.filters h3 small{color:var(--ink3);font-weight:400}
.filters .group{margin-bottom:14px}
.filters .group:last-child{margin-bottom:0}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:7px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.slider{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px}
.slider input{flex:1;accent-color:var(--accent)}
.slider output{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 8px;font-weight:700;font-size:13px;min-width:44px;text-align:center;white-space:nowrap}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.toggle .lab{display:flex;align-items:center;gap:10px}
.toggle .ico{width:30px;height:30px;border-radius:8px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:15px}
.switch{width:40px;height:22px;border-radius:999px;background:var(--line);border:none;position:relative;transition:background .15s;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.sortrow{display:flex;align-items:center;justify-content:space-between;color:var(--ink3);font-size:12px;padding:0 4px}
.sortrow select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;font-size:12px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border-radius:14px;padding:14px;display:grid;grid-template-columns:96px 1fr;gap:14px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.card:hover{border-color:var(--line)}
.card.sel{border-color:var(--accent)}
.thumb{width:96px;height:96px;border-radius:10px;display:grid;place-items:center;font-size:38px;background:var(--block)}
.thumb.c-한식{background:#fbe6df}.thumb.c-중식{background:#fde9d2}.thumb.c-일식{background:#e2eef8}.thumb.c-양식{background:#f6e7d5}.thumb.c-아시안{background:#e4f2e3}.thumb.c-멕시칸{background:#fdefd0}.thumb.c-술집{background:#efe1bd}.thumb.c-카페{background:#ece6df}.thumb.c-분식{background:#fbe3e3}.thumb.c-패스트푸드{background:#fde3d0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .thumb[class*="c-"]{background:var(--block)}}
:root[data-theme="dark"] .thumb[class*="c-"]{background:var(--block)}
.card .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.card .name{font-size:18px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{color:var(--ink2);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.walk{background:var(--green-soft);color:var(--green);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.walk.far{background:var(--warn-soft);color:var(--warn)}
.card .rate{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px;flex-wrap:wrap}
.stars{display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stars b{font-weight:700}
.stars .star{color:var(--star)}
.stars .n{color:var(--ink3);font-size:12px}
.stars .team{color:var(--accent);font-weight:700}
.price{color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--ink2);background:var(--bg);border-radius:4px;padding:1px 6px}
.tag.w{color:var(--warn);background:var(--warn-soft)}
.empty{color:var(--ink3);text-align:center;padding:40px 0}
.mapwrap{position:relative;background:var(--map);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);min-height:420px}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#lmap{position:absolute;inset:0}
.mapctl{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:500}
.mapctl .btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.zoom{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.zoom button{border:none;background:none;width:38px;height:36px;font-size:18px}
.zoom button+button{border-top:1px solid var(--line)}
.legend{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink2);box-shadow:var(--shadow);max-width:320px;z-index:500}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;transform:translate(-50%,-140%);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:600}
.tip.on{opacity:1}
.pin{cursor:pointer}
.pin .b{fill:var(--accent);stroke:#fff;stroke-width:1.5}
.pin .f{fill:#fff}
.pin.dim .b{fill:var(--ink3);opacity:.35}
.pin.dim .f,.pin.dim .badge{opacity:.35}
.pin.sel .b{fill:#c9433a}
.pin .ring{display:none;fill:none;stroke:var(--accent);stroke-width:2;opacity:.6}
.pin.sel .ring{display:block}
.roadlbl{font-size:36px;fill:var(--road-ink);font-family:inherit;paint-order:stroke;stroke:var(--map);stroke-width:8px}
.placelbl{font-size:40px;fill:var(--ink2);font-weight:500}
.stn text{font-size:34px;fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--map);stroke-width:8px}
.lpin{width:34px;height:44px;position:relative;transform:translate(-17px,-44px)}
.lpin svg{width:34px;height:44px;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.lpin.dim{opacity:.3}
.lpin.sel svg path{fill:#c9433a}
.lpin .badge{position:absolute;top:-12px;left:22px;background:#1f2328;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:0 6px;white-space:nowrap}
.lco{transform:translate(-35px,-81px);position:relative}
.lco svg{position:static;inset:auto;width:70px;height:70px}
.lco .lbl{position:absolute;top:109px;left:50%;transform:translateX(-50%);background:#f26457;color:#fff;font-weight:900;font-size:15px;padding:5px 12px;border-radius:9px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.leaflet-container{font:inherit;background:var(--map)}
.leaflet-control-attribution{font-size:10px}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:12px;display:flex;gap:8px;align-items:center;flex:none}
.banner b{color:var(--accent);white-space:nowrap}
.overlay{position:fixed;inset:0;background:rgba(15,18,22,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:2000}
.overlay.on{display:flex}
.modal{background:var(--panel);border-radius:18px;width:min(560px,100%);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .hd{padding:20px 22px 12px;display:flex;gap:14px;align-items:flex-start}
.modal .hd .thumb{width:64px;height:64px;font-size:28px;flex:none}
.modal h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.01em}
.modal .close{margin-left:auto;border:none;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:16px;flex:none}
.modal .info{padding:0 22px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;color:var(--ink2)}
.modal .info dt{color:var(--ink3);font-weight:500}
.modal .info dd{margin:0;color:var(--ink)}
.modal .info a{color:var(--accent)}
.notice{margin:0 22px 14px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12px}
.modal section{border-top:1px solid var(--line);padding:16px 22px}
.modal section h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.modal section h3 small{color:var(--ink3);font-weight:400;font-size:12px}
.rev{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--bg);border-radius:10px;padding:10px 12px}
.rv .who{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-bottom:2px}
.rv .who b{color:var(--ink);font-weight:700}
.rv .stars-s{color:var(--star);letter-spacing:1px;font-size:13px}
.rv p{margin:4px 0 0}
.rv .again{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:4px;padding:0 6px;margin-left:6px}
form.rf{display:grid;gap:10px}
form.rf .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.starpick{display:flex;gap:2px}
.starpick button{border:none;background:none;font-size:26px;color:var(--line);padding:0 2px;line-height:1}
.starpick button.on{color:var(--star)}
form.rf input[type=text],form.rf textarea{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg);width:100%}
form.rf textarea{resize:vertical;min-height:70px}
form.rf label.ck{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px}
.primary[disabled]{opacity:.5;cursor:default}
.msg{font-size:12px;color:var(--ink3)}
.msg.err{color:#c9433a}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3000}
.toast.on{opacity:1}
main[data-view="list"]{grid-template-columns:1fr}
main[data-view="list"] .mapwrap{display:none}
main[data-view="list"] .side{max-width:900px;margin:0 auto;width:100%}
main[data-view="list"] .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
main[data-view="map"]{grid-template-columns:1fr}
main[data-view="map"] .side{display:none}
@media (max-width:860px){
  .app{height:auto;min-height:100vh}
  main{grid-template-columns:1fr;grid-template-rows:auto}
  .mapwrap{height:36vh;min-height:240px;max-height:340px;order:-1}
  .side{overflow:visible}
  main[data-view="map"] .mapwrap{height:calc(100vh - 150px);max-height:none}
  header.top h1{font-size:22px}
  /* 모바일: 핀/가게 클릭 시 아래에서 올라오는 바텀시트 (네이버지도 스타일) */
  .overlay{align-items:flex-end;padding:0;background:rgba(15,18,22,.18)}
  .modal{position:relative;width:100%;max-height:88vh;border-radius:20px 20px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.28);animation:sheetUp .28s cubic-bezier(.2,.8,.2,1);padding-top:8px}
  .modal::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:2px;background:var(--line);z-index:2}
  .modal .hd{padding-top:22px;position:sticky;top:0;background:var(--panel);border-radius:20px 20px 0 0;z-index:1}
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.modal{animation:none!important}}
.subchips{padding-top:6px;padding-bottom:12px}
.subchips .chip{font-size:13px;padding:6px 14px}
.rvact{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.mini{font-size:12px;padding:3px 10px;border:1px solid var(--line);background:var(--panel);border-radius:6px;color:var(--ink2);cursor:pointer}
.mini:hover{background:var(--bg)}
.mini.del{color:#c9433a;border-color:#e7b3ae}
.rvact .cf{font-size:12px;color:var(--ink2)}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1>더워터멜론 근처 맛집</h1>
    <span class="sub">회사에서 걸어서 15분 안에</span>
    <span class="count" id="count"></span>
    <button class="btn viewtoggle" id="viewbtn">🗺 지도만 보기</button>
    <button class="btn viewtoggle" id="myrevbtn">📝 내 리뷰</button>
  </header>
  <nav class="chips" id="chips" aria-label="음식 종류"></nav>
  <nav class="chips subchips" id="subchips" aria-label="세부 종류" hidden></nav>
  <main id="main" data-view="both">
    <aside class="side">
      <div class="banner" id="banner" hidden></div>
      <div class="filters">
        <div class="search"><input id="q" type="search" placeholder="가게 이름 일부, 메뉴 검색" aria-label="검색"></div>
        <div class="group"><h3>가격대 <small>(1인)</small></h3>
          <div class="pills" id="tiers">
            <button class="pill" data-tier="0" aria-pressed="false">1만원 이하</button>
            <button class="pill" data-tier="1" aria-pressed="false">1~2만원</button>
            <button class="pill" data-tier="2" aria-pressed="false">2~4만원</button>
            <button class="pill" data-tier="3" aria-pressed="false">4만원 이상</button>
          </div></div>
        <div class="group"><h3>도보시간 <small>(직선거리 기준 추정)</small></h3>
          <div class="slider"><span>5분</span><input type="range" id="walk" min="5" max="16" step="1" value="16" aria-label="최대 도보시간"><span>15분+</span><output id="walkout">전체</output></div>
        </div>
        <div class="group">
          <div class="toggle"><span class="lab"><span class="ico">🍻</span>팀 회식 되는 곳</span><button class="switch" id="tTeam" role="switch" aria-checked="false" aria-label="팀 회식 되는 곳"></button></div>
          <div class="toggle"><span class="lab"><span class="ico">💬</span>우리 팀 리뷰 있는 곳만</span><button class="switch" id="tRev" role="switch" aria-checked="false" aria-label="우리 팀 리뷰 있는 곳만"></button></div>
        </div>
      </div>
      <div class="sortrow"><span id="shown"></span><label>정렬 <select id="sort"><option value="walk">가까운 순</option><option value="team">우리 팀 별점</option><option value="kakao">카카오맵 별점</option><option value="name">이름순</option></select></label></div>
      <div class="list" id="list"></div>
    </aside>
    <div class="mapwrap" id="mapwrap">
      <div id="lmap" hidden></div>
      <svg id="map" viewBox="-1250 -1150 2500 2100" role="img" aria-label="약도" hidden></svg>
      <div class="tip" id="tip"></div>
      <div class="mapctl">
        <button class="btn" id="showall" hidden>← 전체 보기</button>
        <div class="zoom" id="zoomctl"><button id="zin" aria-label="확대">+</button><button id="zout" aria-label="축소">−</button><button id="zreset" aria-label="원래대로">⌂</button></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </main>
</div>

/* ---------- 리뷰 저장소 ---------- */
const store = {
  mode: REVIEW_API ? 'sheet' : 'local',
  mem: {},
  async load(){
    if (this.mode === 'sheet') {
      const r = await fetch(REVIEW_API + '?action=list', {cache:'no-store'});
      const rows = await r.json(); const out = {};
      rows.forEach(v => { (out[v.placeId] ||= []).push(v); });
      return out;
    }
    try { return JSON.parse(localStorage.getItem('twm-reviews') || '{}'); } catch(e) { return this.mem; }
  },
  async add(placeId, rv){
    if (this.mode === 'sheet') {
      await fetch(REVIEW_API, {method:'POST', body: JSON.stringify({action:'add', placeId, ...rv}), headers:{'Content-Type':'text/plain'}});
      return;
    }
    (reviews[placeId] ||= []).push(rv);
    this._save();
  },
  async remove(rid){
    if (this.mode === 'sheet') {
      await fetch(REVIEW_API, {method:'POST', body: JSON.stringify({action:'delete', rid, owner: MY_ID}), headers:{'Content-Type':'text/plain'}});
      return;
    }
    for (const k in reviews) reviews[k] = reviews[k].filter(r => r.rid !== rid);
    this._save();
  },
  async edit(rid, fields){
    if (this.mode === 'sheet') {
      await fetch(REVIEW_API, {method:'POST', body: JSON.stringify({action:'update', rid, owner: MY_ID, ...fields}), headers:{'Content-Type':'text/plain'}});
      return;
    }
    for (const k in reviews) reviews[k].forEach(r => { if (r.rid === rid) Object.assign(r, fields); });
    this._save();
  },
  _save(){ try { localStorage.setItem('twm-reviews', JSON.stringify(reviews)); } catch(e) { this.mem = reviews; } }
};

/* ---------- 유틸 ---------- */
const teamAvg = p => { const r = reviews[p.id] || []; return r.length ? r.reduce((a,b)=>a+Number(b.rating),0)/r.length : null; };
const isTeamDiningReview = r => r.teamDining === true || r.teamDining === 'true' || r.teamDining === 'TRUE';
const canTeamDine = p => (reviews[p.id] || []).some(isTeamDiningReview);
const fmt = n => n == null ? '-' : Number(n).toLocaleString('ko-KR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kakaoUrl = p => p.kid ? 'https://place.map.kakao.com/' + p.kid : 'https://map.kakao.com/?q=' + encodeURIComponent(p.name + ' ' + (p.kaddr||p.addr));
const naverUrl = p => 'https://map.naver.com/p/search/' + encodeURIComponent(p.name.replace(/\(.*?\)/g,'').trim() + ' ' + (p.kaddr||p.addr).split(' ').slice(0,3).join(' '));
const walkLabel = p => p.far ? `${p.walk}분 (15분 초과)` : `${p.walk}분`;

const normalizeSearch = value => String(value ?? '').normalize('NFKC').toLowerCase().replace(/\s+/g, '');
function filtered(){
  const q = normalizeSearch(state.q);
  let arr = PLACES.filter(p =>
    (state.cat === '전체' || p.cat === state.cat) &&
    (state.cat === '전체' || state.subcat === '전체' || p.subcat === state.subcat) &&
    (!state.tiers.size || state.tiers.has(p.tier)) &&
    (state.walk >= 16 || p.walk <= state.walk) &&
    (!state.team || canTeamDine(p)) &&
    (!state.rev || (reviews[p.id]||[]).length) &&
    (!q || [p.name, p.kname, p.menu, p.sub, p.note, p.addr, p.kaddr].some(value => normalizeSearch(value).includes(q))));
  const s = state.sort;
  arr.sort((a,b) => s==='walk' ? a.walk-b.walk || (b.kr||0)-(a.kr||0)
    : s==='team' ? (teamAvg(b)??-1)-(teamAvg(a)??-1) || a.walk-b.walk
    : s==='kakao' ? (b.kr||0)-(a.kr||0) || (b.kn||0)-(a.kn||0)
    : a.name.localeCompare(b.name,'ko'));
  return arr;
}

 '양식':['이탈리안·파스타','피자','스테이크·그릴','버거','프렌치·유러피언','기타 양식'],
 '중식':['중식당','양꼬치·마라','딤섬·고급'],
 '아시안':['베트남','태국','인도','기타 아시안'],

 '카페':['카페·커피','베이커리','디저트','테마카페'],
};
function subcatsFor(cat){
  const order = SUBCAT_ORDER[cat]; if (!order) return [];
  const present = new Set(PLACES.filter(p=>p.cat===cat).map(p=>p.subcat));
  const list = order.filter(s=>present.has(s));
  return list.length>1 ? ['전체', ...list] : [];
}
function renderSubChips(){
  const el = $('#subchips'); const subs = subcatsFor(state.cat);
  if (!subs.length){ el.hidden = true; el.innerHTML=''; return; }
  el.hidden = false;
  el.innerHTML = subs.map(s=>`<button class="chip" data-sub="${s}" aria-pressed="${s===state.subcat}">${s}</button>`).join('');
}
function starsHtml(p){
  const t = teamAvg(p), n = (reviews[p.id]||[]).length;
  return `<div class="stars">
    ${t != null ? `<span><span class="star">★</span> <b class="team">${t.toFixed(1)}</b> <span class="n">우리 팀 ${n}</span></span>` : `<span class="n">우리 팀 리뷰 아직 없음</span>`}
    ${p.kr != null ? `<span><span class="star">★</span> <b>${p.kr.toFixed(1)}</b> <span class="n">카카오맵 ${fmt(p.kn)}건</span></span>` : `<span class="n">카카오맵 평점 없음</span>`}
  </div>`;
}

/* ---------- 지도 공통 ---------- */
const M_PER_LAT = 111320, M_PER_LON = 111320 * Math.cos(COMPANY.lat * Math.PI / 180);
const toXY = (lat, lon) => [ (lon - COMPANY.lon) * M_PER_LON, (lat - COMPANY.lat) * M_PER_LAT ];
const R15 = 15 * 75 / 1.3;
const PIN_PATH = 'M0 0 C-14 -20 -26 -32 -26 -50 A26 26 0 1 1 26 -50 C26 -32 14 -20 0 0 Z';

/* ---------- 약도 (SVG) ---------- */
function svgMap(){
  const svg = $('#map'); svg.hidden = false;
  const NS = 'http://www.w3.org/2000/svg';
  const el = (t, a={}, txt) => { const e = document.createElementNS(NS,t); for (const k in a) e.setAttribute(k,a[k]); if (txt!=null) e.textContent = txt; return e; };
  const P = (lat,lon) => { const [x,y] = toXY(lat,lon); return [x, -y]; };
  const g = el('g');
  let seed = 3; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  for (let x=-1250; x<1250; x+=110) for (let y=-1150; y<950; y+=90) { if (rnd() < .12) continue; g.appendChild(el('rect',{x:x+8,y:y+8,width:70+rnd()*30,height:55+rnd()*25,rx:4,fill:'var(--block)'})); }
  for (let x=-1200; x<1250; x+=220) g.appendChild(el('line',{x1:x,y1:-1150,x2:x,y2:950,stroke:'var(--road)','stroke-width':6,opacity:.7}));
  for (let y=-1100; y<950; y+=180) g.appendChild(el('line',{x1:-1250,y1:y,x2:1250,y2:y,stroke:'var(--road)','stroke-width':6,opacity:.7}));
  const [px,py] = P(PARK.lat, PARK.lon);

  g.appendChild(el('text',{x:px,y:py+14,class:'placelbl','text-anchor':'middle'},PARK.name));
  ROADS.forEach(([name, pts, w]) => {
    const d = pts.map((p,i) => (i?'L':'M') + P(...p).join(' ')).join(' ');
    g.appendChild(el('path',{d,fill:'none',stroke:'var(--road)','stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'}));
    const i0 = Math.floor(pts.length/2) - 1; const a = P(...pts[i0]), b = P(...pts[i0+1]);
    const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];

    g.appendChild(el('text',{x:mid[0],y:mid[1]-16,class:'roadlbl','text-anchor':'middle',transform:`rotate(${ang} ${mid[0]} ${mid[1]})`},name));
  });
  const line7 = LANDMARKS.filter(s=>s.line==='7').sort((a,b)=>a.lon-b.lon).map(s=>P(s.lat,s.lon));
  g.appendChild(el('path',{d:line7.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '),fill:'none',stroke:'#6f8f3a','stroke-width':4,'stroke-dasharray':'18 10',opacity:.8}));
  const line3 = LANDMARKS.filter(s=>s.line==='3').sort((a,b)=>a.lat-b.lat).map(s=>P(s.lat,s.lon));
  g.appendChild(el('path',{d:line3.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '),fill:'none',stroke:'#e08a1e','stroke-width':4,'stroke-dasharray':'18 10',opacity:.8}));
  LANDMARKS.forEach(s => { const [x,y] = P(s.lat,s.lon); const st = el('g',{class:'stn'});
    st.appendChild(el('circle',{cx:x,cy:y,r:30,fill:s.color,stroke:'#fff','stroke-width':6}));
    st.appendChild(el('text',{x,y:y+12,'text-anchor':'middle',style:'fill:#fff;font-size:30px;font-weight:700;stroke:none'},s.line));
    st.appendChild(el('text',{x,y:y+72,'text-anchor':'middle'},s.name));
    g.appendChild(st); });
  g.appendChild(el('circle',{cx:0,cy:0,r:R15,fill:'var(--accent)','fill-opacity':.07,stroke:'var(--accent)','stroke-width':3,'stroke-dasharray':'12 10',opacity:.9}));
  const lb = el('g'); lb.appendChild(el('rect',{x:R15-100,y:-55,width:200,height:110,rx:16,fill:'var(--accent)'}));
  lb.appendChild(el('text',{x:R15,y:-5,'text-anchor':'middle',style:'fill:#fff;font-size:42px;font-weight:700'},'15분'));
  lb.appendChild(el('text',{x:R15,y:35,'text-anchor':'middle',style:'fill:#fff;font-size:28px'},'도보 거리'));
  g.appendChild(lb);
  const c = el('g');
  c.appendChild(el('path',{d:'M0 0 C-30 -40 -60 -70 -60 -110 A60 60 0 1 1 60 -110 C60 -70 30 -40 0 0 Z',fill:'#2f8f5b',stroke:'#fff','stroke-width':4}));
  c.appendChild(el('path',{d:'M0 -12 C-22 -40 -46 -66 -46 -100 A46 46 0 1 1 46 -100 C46 -66 22 -40 0 -12 Z',fill:'#f26457'}));
  [[-14,-118],[10,-104],[-2,-88],[16,-124],[-20,-96]].forEach(([x,y]) => c.appendChild(el('ellipse',{cx:x,cy:y,rx:3.5,ry:5,fill:'#1f2328'})));
  c.appendChild(el('rect',{x:-150,y:14,width:300,height:76,rx:16,fill:'#f26457'}));
  c.appendChild(el('text',{x:0,y:68,'text-anchor':'middle',style:'fill:#fff;font-size:44px;font-weight:900'},COMPANY.name));
  g.appendChild(c);
  svg.appendChild(g);
  const pins = el('g'); svg.appendChild(pins);
  const HOME = {x:-1250,y:-1150,w:2500,h:2100}; let vb = {...HOME};
  const applyVB = () => svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const zoom = (f, cx, cy) => { cx ??= vb.x+vb.w/2; cy ??= vb.y+vb.h/2; vb = {x:cx-(cx-vb.x)*f, y:cy-(cy-vb.y)*f, w:vb.w*f, h:vb.h*f}; applyVB(); };
  $('#zin').onclick = () => zoom(.75); $('#zout').onclick = () => zoom(1.33); $('#zreset').onclick = () => { vb = {...HOME}; applyVB(); };
  const pt = ev => { const r = svg.getBoundingClientRect(); const s = Math.max(vb.w/r.width, vb.h/r.height); const ox = (r.width - vb.w/s)/2, oy = (r.height - vb.h/s)/2; return {x: vb.x + (ev.clientX-r.left-ox)*s, y: vb.y + (ev.clientY-r.top-oy)*s, s}; };
  svg.addEventListener('wheel', ev => { ev.preventDefault(); const p = pt(ev); zoom(ev.deltaY>0?1.15:.87, p.x, p.y); }, {passive:false});
  let drag = null;
  svg.addEventListener('pointerdown', ev => { drag = {x:ev.clientX,y:ev.clientY,vx:vb.x,vy:vb.y,moved:false}; svg.setPointerCapture(ev.pointerId); });
  svg.addEventListener('pointermove', ev => { if(!drag) return; const s = pt(ev).s; const dx=ev.clientX-drag.x, dy=ev.clientY-drag.y; if (Math.abs(dx)+Math.abs(dy)>4) drag.moved=true; vb.x = drag.vx - dx*s; vb.y = drag.vy - dy*s; applyVB(); });
  svg.addEventListener('pointerup', ev => { const moved = drag?.moved; drag = null; if (moved) return; const pin = ev.target.closest('.pin'); if (pin) select(pin.dataset.id, true); });
  svg.addEventListener('pointerover', ev => { const pin = ev.target.closest('.pin'); const tip = $('#tip'); if (!pin) { tip.classList.remove('on'); return; } const p = PLACES.find(x=>x.id===pin.dataset.id); const r = $('#mapwrap').getBoundingClientRect(); tip.textContent = `${p.name} · ${p.walk}분`; tip.style.left = (ev.clientX-r.left)+'px'; tip.style.top = (ev.clientY-r.top)+'px'; tip.classList.add('on'); });
  svg.addEventListener('pointerout', () => $('#tip').classList.remove('on'));
  $('#legend').innerHTML = '약도예요. 가게 위치는 카카오맵 좌표라 정확하지만 도로는 큰길만 대략 그렸어요. 길찾기는 가게 상세에서 <b>카카오맵</b>으로 열어보세요.';
  return {
    renderPins(visible){

      PLACES.slice().sort((a,b) => (a.id===state.sel) - (b.id===state.sel) || b.lat - a.lat).forEach(p => {

        const [x,y] = P(p.lat,p.lon);
        const pin = el('g',{class:`pin ${visible.has(p.id)?'':'dim'} ${state.sel===p.id?'sel':''}`,transform:`translate(${x} ${y})`,'data-id':p.id});
        pin.appendChild(el('circle',{class:'ring',cx:0,cy:-30,r:38}));
        pin.appendChild(el('path',{class:'b',d:PIN_PATH}));
        pin.appendChild(el('text',{class:'f',x:0,y:-43,'text-anchor':'middle',style:'font-size:24px'},'🍴'));
        const t = teamAvg(p);

        pins.appendChild(pin);

    }
  };
}

/* ---------- 실제 지도 (Leaflet + OpenStreetMap) ---------- */
function leafletMap(){
  $('#lmap').hidden = false; $('#zoomctl').style.display = 'none'; $('#map').style.display = 'none';
  const map = L.map('lmap', {zoomControl:true, scrollWheelZoom:true}).setView([COMPANY.lat, COMPANY.lon], 16);
  map.createPane('company'); map.getPane('company').style.zIndex = 690; map.getPane('company').style.pointerEvents = 'none';
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  L.circle([COMPANY.lat, COMPANY.lon], {radius:R15, color:'#f26457', weight:2, dashArray:'8 6', fillColor:'#f26457', fillOpacity:.07}).addTo(map);
  const co = L.divIcon({className:'', html:`<div class="lco"><svg width="110" height="110" viewBox="-90 -176 180 180"><path d="M0 0 C-30 -40 -60 -70 -60 -110 A60 60 0 1 1 60 -110 C60 -70 30 -40 0 0 Z" fill="#35a15e" stroke="#1e7a45" stroke-width="2"/><path d="M0 -14.7 C-26 -49.3 -52 -75.3 -52 -110 A52 52 0 1 1 52 -110 C52 -75.3 26 -49.3 0 -14.7 Z" fill="#ffffff"/><path d="M0 -27.5 C-22.5 -57.5 -45 -80 -45 -110 A45 45 0 1 1 45 -110 C45 -80 22.5 -57.5 0 -27.5 Z" fill="#f2564f"/><ellipse cx="-17" cy="-122" rx="4" ry="5.5" fill="#1f2328"/><ellipse cx="17" cy="-122" rx="4" ry="5.5" fill="#1f2328"/><ellipse cx="0" cy="-108" rx="4" ry="5.5" fill="#1f2328"/><ellipse cx="-15" cy="-93" rx="4" ry="5.5" fill="#1f2328"/><ellipse cx="15" cy="-93" rx="4" ry="5.5" fill="#1f2328"/></svg></div>`, iconSize:[0,0]});
  L.marker([COMPANY.lat, COMPANY.lon], {icon:co, pane:'company', interactive:false}).addTo(map);
  const cluster = L.markerClusterGroup({chunkedLoading:true, maxClusterRadius:55, spiderfyOnMaxZoom:true, showCoverageOnHover:false});
  map.addLayer(cluster);
  const markers = {};
  PLACES.forEach(p => {
    const m = L.marker([p.lat, p.lon], {icon: L.divIcon({className:'', html:'', iconSize:[0,0]})});
    m.on('click', () => select(p.id, true));

    markers[p.id] = m;
  });
  $('#legend').innerHTML = '지도: OpenStreetMap · 가게 위치는 카카오맵 좌표 기준. 가게를 누르면 카카오맵 길찾기로 이어져요.';
  return {
    renderPins(visible){
      cluster.clearLayers();
      const solo = state.sel;
      const show = [];
      PLACES.forEach(p => {
        if (solo ? p.id !== solo : !visible.has(p.id)) return;
        const t = teamAvg(p);
        const html = `<div class="lpin ${state.sel===p.id?'sel':''}"><svg viewBox="-31 -78 62 80"><path d="${PIN_PATH}" fill="#f26457" stroke="#fff" stroke-width="2"/></svg>${t!=null?`<span class="badge">★${t.toFixed(1)}</span>`:''}</div>`;
        markers[p.id].setIcon(L.divIcon({className:'', html, iconSize:[0,0]}));
        markers[p.id].setZIndexOffset(state.sel===p.id ? 900 : 100);
        show.push(markers[p.id]);
      });
      cluster.addLayers(show);
    },
    focus(p){ map.panTo([p.lat, p.lon]); },
    solo(p){ map.fitBounds([[COMPANY.lat, COMPANY.lon], [p.lat, p.lon]], {padding:[70,70], maxZoom:17}); },
    showAll(){ map.setView([COMPANY.lat, COMPANY.lon], 16); },
    invalidate(){ map.invalidateSize(); }
  };
}

  editingRid = rid; pick = Number(target.rating)||0;
  $('#sp').querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.v <= pick));
  $('#spmsg').textContent = ['','별로예요','그저 그래요','괜찮아요','맛있어요','최고예요'][pick] || '';
  $('#rname').value = (target.name && target.name!=='익명') ? target.name : '';
  $('#rtext').value = target.text || '';
  $('#ragain').checked = !!target.again;
  $('#rteam').checked = isTeamDiningReview(target);
  $('#rsub').disabled = false; $('#rsub').textContent = '수정 저장';
  const sec = $('#rf').closest('section'); const hh = sec && sec.querySelector('h3'); if (hh) hh.textContent = '리뷰 수정';
  $('#rf').scrollIntoView({block:'nearest', behavior:'smooth'});
}
function showMyReviews(){
  const mine=[];
  for (const pid in reviews) (reviews[pid]||[]).forEach(r=>{ if(r.owner && r.owner===MY_ID) mine.push(Object.assign({}, r, {placeId:pid})); });
  mine.sort((a,b)=>(b.ts||0)-(a.ts||0));
  $('#modal').innerHTML = `
    <div class="hd"><div><h2>내 리뷰</h2><div class="meta" style="color:var(--ink2)">이 브라우저에서 남긴 리뷰 ${mine.length}개</div></div><button class="close" aria-label="닫기" id="mclose">✕</button></div>
    ${mine.length ? `<div class="rev">${mine.map(r=>{ const p=PLACES.find(x=>x.id===r.placeId); return `<div class="rv" data-rid="${esc(r.rid||'')}"><div class="who"><span><b>${p?esc(p.name):'(삭제된 가게)'}</b>${r.again?'<span class="again">또 갈래요</span>':''}${isTeamDiningReview(r)?'<span class="again">🍻 회식 가능</span>':''}</span><span>${r.ts?new Date(Number(r.ts)).toLocaleDateString('ko-KR'):''}</span></div><div class="stars-s">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>${r.text?`<p>${esc(r.text)}</p>`:''}<div class="rvact">${p?`<button type="button" class="mini" data-go="${esc(r.placeId)}">가게 보기</button>`:''}<button type="button" class="mini del" data-delmine="${esc(r.rid||'')}">삭제</button></div></div>`; }).join('')}</div>` : `<div class="msg" style="padding:20px 0">아직 이 브라우저에서 남긴 리뷰가 없어요.</div>`}`;
  $('#overlay').classList.add('on');
  $('#mclose').onclick = closeModal;
  $('#modal').querySelectorAll('[data-go]').forEach(b => b.onclick = () => showModal(b.dataset.go));
  $('#modal').querySelectorAll('[data-delmine]').forEach(b => b.onclick = async () => {
    const rid=b.dataset.delmine; b.textContent='삭제 중…';
    try{ await store.remove(rid); if(store.mode==='sheet') reviews=await store.load(); toast('리뷰를 삭제했어요'); showMyReviews(); renderList(); }catch(e){ b.textContent='실패'; }
  });
}
$('#myrevbtn').onclick = showMyReviews;
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'), 1800); }

/* ---------- 이벤트 ---------- */
$('#chips').addEventListener('click', ev => { const b = ev.target.closest('.chip'); if (!b) return; state.cat = b.dataset.cat; state.subcat = '전체'; state.sel = null; renderChips(); renderSubChips(); renderList(); });
$('#subchips').addEventListener('click', ev => { const b = ev.target.closest('.chip'); if (!b) return; state.subcat = b.dataset.sub; state.sel = null; renderSubChips(); renderList(); });
$('#tiers').addEventListener('click', ev => { const b = ev.target.closest('.pill'); if (!b) return; const t = +b.dataset.tier; state.tiers.has(t) ? state.tiers.delete(t) : state.tiers.add(t); b.setAttribute('aria-pressed', state.tiers.has(t)); state.sel = null; renderList(); });
$('#walk').addEventListener('input', ev => { state.walk = +ev.target.value; $('#walkout').textContent = state.walk >= 16 ? '전체' : state.walk + '분'; state.sel = null; renderList(); });
[['tTeam','team'],['tRev','rev']].forEach(([id,k]) => $('#'+id).addEventListener('click', ev => { state[k] = !state[k]; ev.currentTarget.setAttribute('aria-checked', state[k]); state.sel = null; renderList(); }));
$('#q').addEventListener('input', ev => { state.q = ev.target.value; state.sel = null; renderList(); });
$('#sort').addEventListener('change', ev => { state.sort = ev.target.value; renderList(); });
$('#list').addEventListener('click', ev => { const c = ev.target.closest('.card'); if (c) select(c.dataset.id, true); });
$('#list').addEventListener('keydown', ev => { const c = ev.target.closest('.card'); if (c && (ev.key==='Enter'||ev.key===' ')) { ev.preventDefault(); select(c.dataset.id, true); } });
const views = ['both','map','list'], vlabel = {both:'🗺 지도만 보기', map:'☰ 목록만 보기', list:'⧉ 목록과 지도 함께 보기'};
$('#viewbtn').onclick = () => { const m = $('#main'); const i = (views.indexOf(m.dataset.view)+1)%3; m.dataset.view = views[i]; $('#viewbtn').textContent = vlabel[views[i]]; if (MAP.invalidate) setTimeout(() => { MAP.invalidate(); renderCards(); }, 60); };
$('#showall').onclick = () => { state.sel = null; renderList(); if (MAP.showAll) MAP.showAll(); };

/* ---------- 시작 ---------- */
MAP = (MAP_MODE === 'leaflet' && window.L) ? leafletMap() : svgMap();
renderChips(); renderSubChips(); renderList();
(async () => {
  try { reviews = await store.load(); } catch(e) { reviews = {}; }
  const b = $('#banner');
  if (store.mode === 'local') { b.hidden = false; b.innerHTML = '<b>미리보기</b> 리뷰가 이 브라우저에만 저장돼요. 구글 시트를 연결하면 팀 전체가 함께 써요.'; }
  renderList();
})();
</script>

</body>
</html>
